<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CGate-MRI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <span class="brand"><a href="/">CGate<span class="accent">-</span>MRI</a></span>
      <nav>
        <a href="/">Home</a>
        <a href="/analyze">MRI analysis</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer wrap">
    <p><strong>Research prototype</strong> &mdash; final-year project demonstration.
       Not a medical device; not for clinical use.</p>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
